<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PLAY 12 — Músicas Variadas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  :root{--cor:#cc44ff}
  body{background:#0a0a0a;overflow:hidden;height:100vh}
  .bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.3;pointer-events:none}
  .app{position:relative;z-index:10;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:space-between}
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border-bottom:2px solid var(--cor);gap:4px;flex-shrink:0;transition:border-color .3s}
  .genre-badge{background:rgba(255,255,255,.08);padding:3px 8px;border-radius:30px;font-size:.55rem;font-weight:700;color:#fff;border-left:2px solid var(--cor);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%;transition:border-color .3s}
  .top-buttons{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .fav-top-btn{background:rgba(255,45,127,.15);border:1px solid #ff2d7f;color:#ff2d7f;padding:3px 8px;border-radius:30px;font-size:.5rem;cursor:pointer;display:flex;align-items:center;gap:3px}
  .fav-top-btn:active{transform:scale(.92);background:#ff2d7f;color:#000}
  .fav-top-btn .badge{background:#ff2d7f;color:#000;border-radius:50%;padding:0 4px;font-size:.45rem;font-weight:700;min-width:14px;text-align:center}
  .search-wrapper{position:relative;display:inline-block}
  .search-input{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 20px 3px 8px;color:#fff;font-size:.5rem;width:70px;transition:width .3s,border-color .3s;-webkit-appearance:none;appearance:none}
  .search-input:focus{width:120px;outline:none;border-color:var(--cor)}
  .search-input::placeholder{color:#888}
  .clear-search{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#888;cursor:pointer;font-size:.5rem;display:none;padding:0 2px}
  .audio-status{font-size:.45rem;color:#aaa;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}
  .audio-status.active{color:#4ade80;border-color:#4ade80}
  .audio-status .dot{width:4px;height:4px;border-radius:50%;background:#666}
  .audio-status.active .dot{background:#4ade80;animation:pulse-dot 1s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
  .info-scroll{position:fixed;top:42px;left:0;right:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:6px 12px;z-index:30;border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;white-space:nowrap}
  .info-scroll p{color:#fff;font-size:.85rem;font-weight:900;letter-spacing:2px;animation:scrollText 20s linear infinite;display:inline-block;padding-right:50px;text-transform:uppercase}
  @keyframes scrollText{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  .now-playing{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:15;width:90%;max-width:400px;user-select:none}
  .music-title{color:#fff;font-size:1.4rem;font-weight:700;text-shadow:0 0 30px rgba(0,0,0,.9);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .music-artist{color:#eee;font-size:1rem;font-weight:300;text-shadow:0 0 30px rgba(0,0,0,.9);margin-bottom:8px}
  .fav-heart-center{display:flex;justify-content:center;margin:10px 0}
  .fav-heart{font-size:3.5rem;color:#555;cursor:pointer;transition:all .3s;text-shadow:0 0 30px rgba(0,0,0,.9)}
  .fav-heart.active{color:#ff2d7f;text-shadow:0 0 40px rgba(255,45,127,.5)}
  .fav-heart:active{transform:scale(1.2)}
  .equalizer{display:flex;gap:3px;justify-content:center;height:30px;margin-top:8px;align-items:flex-end}
  .equalizer span{width:4px;background:var(--cor);border-radius:3px;animation:equalize .6s infinite alternate ease-in-out;transition:background .3s}
  .equalizer span:nth-child(1){animation-delay:0s;height:10px}
  .equalizer span:nth-child(2){animation-delay:.1s;height:22px}
  .equalizer span:nth-child(3){animation-delay:.2s;height:14px}
  .equalizer span:nth-child(4){animation-delay:.3s;height:28px}
  .equalizer span:nth-child(5){animation-delay:.4s;height:18px}
  .equalizer span:nth-child(6){animation-delay:.5s;height:26px}
  .equalizer span:nth-child(7){animation-delay:.6s;height:12px}
  .equalizer span:nth-child(8){animation-delay:.7s;height:24px}
  .equalizer span:nth-child(9){animation-delay:.8s;height:16px}
  .equalizer span:nth-child(10){animation-delay:.9s;height:20px}
  @keyframes equalize{0%{height:4px;opacity:.5}100%{height:30px;opacity:1}}
  .equalizer.paused span{animation-play-state:paused;height:4px!important;opacity:.3!important}
  .teaching-bar{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(12px);padding:6px 22px;border-radius:40px;font-size:.6rem;font-weight:800;color:#ddd;z-index:26;pointer-events:none;border:1px solid rgba(255,255,255,.05);white-space:nowrap}
  .teaching-bar .cyan{color:var(--cor);font-weight:900;transition:color .3s}
  .bottom-controls{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.05);padding:6px 12px 10px;z-index:20;transform:translateY(100%);transition:transform .3s ease}
  .bottom-controls.visible{transform:translateY(0)}
  .progress-time{display:flex;justify-content:space-between;font-size:.5rem;color:#aaa;margin-bottom:2px}
  .progress-bar{height:3px;background:rgba(255,255,255,.15);cursor:pointer;border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:var(--cor);width:0%;border-radius:4px;transition:width .2s linear,background .3s}
  .buttons-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
  .ctrl-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.8rem;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ctrl-btn:active{transform:scale(.92);background:var(--cor);color:#000}
  .play-big{background:var(--cor);width:44px;height:44px;font-size:1.1rem;color:#000;border:none}
  .shuffle-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.7rem;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .shuffle-btn.active{background:var(--cor);color:#000;border-color:var(--cor)}
  .fab-container{position:fixed;bottom:100px;right:12px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .fab-main{background:linear-gradient(135deg,#3a3a3a,#1a1a1a);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.2rem;border:1px solid rgba(255,255,255,.1)}
  .fab-main:active{transform:scale(.92)}
  .fab-sub{background:rgba(0,0,0,.92);backdrop-filter:blur(14px);border-radius:16px;padding:5px;display:none;flex-direction:column;gap:3px;border:1px solid rgba(255,255,255,.1);min-width:180px}
  .fab-sub.open{display:flex}
  .fab-section-label{color:rgba(255,255,255,.5);font-size:.55rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px 2px}
  .fab-sub-btn{background:rgba(255,255,255,.05);border:none;color:#fff;padding:8px 14px;border-radius:12px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;text-align:left}
  .fab-sub-btn:active{background:var(--cor);color:#000}
  .genre-option.active{background:var(--cor)!important;color:#000!important;font-weight:700}
  #splash{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
  #splash.hidden{opacity:0;pointer-events:none}
  .splash-loading{text-align:center;color:#fff;padding:0 20px}
  .splash-loading i{font-size:2rem;color:var(--cor);transition:color .3s}
  .splash-loading p{margin-top:10px;font-size:.85rem;line-height:1.5}
  #tap-to-start{position:fixed;bottom:30%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#4ade80,#22c55e);color:#000;padding:14px 28px;border-radius:60px;font-weight:900;font-size:1.1rem;z-index:10000;cursor:pointer;display:none;animation:btnPulse 1.5s infinite;border:none;box-shadow:0 0 40px rgba(74,222,128,.6);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
  @keyframes btnPulse{0%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(1.04);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:.9}}
  .notification{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);backdrop-filter:blur(10px);color:var(--cor);padding:4px 14px;border-radius:30px;font-size:.55rem;z-index:10001;opacity:0;transition:opacity .3s,color .3s;pointer-events:none;border-left:3px solid var(--cor);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  .notification.show{opacity:1}
  #loadingOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;align-items:center;justify-content:center}
  #loadingOverlay.active{display:flex}
  #loadingOverlay i{font-size:3rem;color:var(--cor);animation:spin 1s linear infinite;transition:color .3s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fav-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(20,20,40,.95);backdrop-filter:blur(20px);border-radius:30px;padding:25px;z-index:5000;width:90%;max-width:380px;text-align:center;display:none;flex-direction:column;opacity:0;transition:all .3s ease;border:2px solid var(--cor)}
  .fav-modal.open{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
  .fav-modal h3{font-size:1.2rem;margin-bottom:15px;color:var(--cor);transition:color .3s}
  .fav-modal .close-fav{position:absolute;top:12px;right:16px;background:transparent;border:none;color:#888;font-size:1.5rem;cursor:pointer}
  .fav-list{max-height:50vh;overflow-y:auto;text-align:left;margin-bottom:15px}
  .fav-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);color:#fff}
  .fav-item .info{flex:1;cursor:pointer;min-width:0}
  .fav-item .info .title{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav-item .info .artist{font-size:.7rem;color:#aaa}
  .fav-item .remove{background:transparent;border:none;color:#ff2d7f;font-size:1.1rem;cursor:pointer;padding:4px 8px}
  .fav-empty{color:#888;padding:30px;text-align:center}
  .fav-modal .close-btn{background:var(--cor);border:none;padding:12px;border-radius:30px;color:#000;font-weight:700;cursor:pointer;font-size:.95rem;transition:background .3s}
  @media(max-width:480px){
    .music-title{font-size:1.2rem}.music-artist{font-size:.9rem}.fav-heart{font-size:2.5rem}
    .genre-badge{font-size:.45rem;max-width:30%;padding:2px 6px}.fav-top-btn{font-size:.45rem;padding:2px 6px}
    .fab-main{width:42px;height:42px;font-size:1rem}.fab-sub-btn{padding:6px 10px;font-size:.6rem}
    .search-input{width:55px;font-size:.45rem}.search-input:focus{width:100px}
    .top-bar{padding:4px 6px}.info-scroll{top:40px;padding:4px 10px}.info-scroll p{font-size:.7rem;letter-spacing:1px}
    .ctrl-btn{width:28px;height:28px;font-size:.65rem}.play-big{width:36px;height:36px;font-size:.9rem}
    .buttons-row{gap:8px}.teaching-bar{bottom:95px;font-size:.5rem;padding:5px 14px}
    .bottom-controls{padding:4px 8px 8px}.audio-status{font-size:.4rem;padding:1px 4px}
    .fab-container{bottom:80px;right:8px}#tap-to-start{padding:10px 18px;font-size:.9rem;bottom:25%}
  }
</style>
</head>
<body>

<video id="bgVideo" class="bg" autoplay loop muted playsinline>
  <source src="mpb.mp4" type="video/mp4">
</video>

<div id="splash">
  <div class="splash-loading">
    <i class="fas fa-circle-notch fa-spin"></i>
    <p id="splashMsg">Carregando Músicas Variadas...</p>
  </div>
</div>

<div id="tap-to-start">▶ ATIVAR RÁDIO</div>

<div class="app" id="appContainer" style="display:none">
  <div class="top-bar">
    <div class="genre-badge" id="genreBadge">🎧 MÚSICAS VARIADAS</div>
    <div class="top-buttons">
      <span class="audio-status" id="audioStatus"><span class="dot"></span> Aguardando</span>
      <div class="search-wrapper">
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="clear-search" id="clearSearchBtn"><i class="fas fa-times"></i></button>
      </div>
      <button class="fav-top-btn" id="favTopBtn">
        <i class="fas fa-heart"></i> <span class="badge" id="favCount">0</span>
      </button>
    </div>
  </div>

  <div class="info-scroll">
    <p id="scrollText">🎵 RÁDIO PLAY 12 — MÚSICAS VARIADAS 🎵</p>
  </div>

  <div class="now-playing" id="nowPlaying">
    <div class="music-title" id="nowTitle">Carregando...</div>
    <div class="music-artist" id="nowArtist">Aguarde</div>
    <div class="fav-heart-center">
      <div class="fav-heart" id="heartBtn"><i class="far fa-heart"></i></div>
    </div>
    <div class="equalizer" id="equalizer">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="teaching-bar">👆 Toque na tela para <span class="cyan">controles</span></div>
</div>

<div class="fav-modal" id="favModal">
  <button class="close-fav" id="closeFavModal"><i class="fas fa-times"></i></button>
  <h3><i class="fas fa-heart" style="color:#ff2d7f"></i> Suas Favoritas</h3>
  <div class="fav-list" id="favList"><div class="fav-empty">Nenhuma música favorita</div></div>
  <button class="close-btn" id="closeFavBtn">FECHAR</button>
</div>

<div class="bottom-controls" id="bottomControls">
  <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="buttons-row">
    <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
    <button class="ctrl-btn play-big" id="playBtn"><i class="fas fa-play"></i></button>
    <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
    <button class="shuffle-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
  </div>
</div>

<div class="fab-container">
  <div class="fab-sub" id="fabSub">
    <div class="fab-section-label">🎧 Gênero</div>
    <button class="fab-sub-btn genre-option active" data-genre="variadas"><i class="fas fa-music"></i> Músicas Variadas</button>
    <button class="fab-sub-btn genre-option" data-genre="rogervar"><i class="fas fa-bolt"></i> Rogervar</button>
    <div class="fab-section-label">⚙️ Controles</div>
    <button class="fab-sub-btn" id="fabFullscreen"><i class="fas fa-expand"></i> Tela Cheia</button>
    <button class="fab-sub-btn" id="fabReload"><i class="fas fa-sync"></i> Recarregar Playlist</button>
    <button class="fab-sub-btn" id="fabShare"><i class="fas fa-share-alt"></i> Compartilhar</button>
  </div>
  <div class="fab-main" id="fabMain"><i class="fas fa-plus"></i></div>
</div>

<div class="notification" id="notification"></div>
<div id="loadingOverlay"><i class="fas fa-spinner fa-spin"></i></div>

<audio id="musicPlayer" preload="auto" playsinline></audio>
<audio id="backgroundAudio" preload="auto" playsinline loop style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px;left:-9999px;"></audio>

<script>
const GENRES = {
  variadas: {
    nome: 'MÚSICAS VARIADAS',
    cor: '#cc44ff',
    jsonUrl: 'https://paticotv01-code.github.io/Listavariada-/music.json',
    baseUrl: 'https://paticotv01-code.github.io/Listavariada-/',
    jsonUrlFallback: 'https://raw.githubusercontent.com/paticotv01-code/Listavariada-/refs/heads/main/music.json',
    baseUrlFallback: 'https://raw.githubusercontent.com/paticotv01-code/Listavariada-/refs/heads/main/',
    storageKeyFav: 'radio_favorites_variadas',
    storageKeySrc: 'radio_src_cache_variadas'
  },
  rogervar: {
    nome: 'ROGERVAR',
    cor: '#ff8800',
    jsonUrl: 'https://paticotv01-code.github.io/Listavariada-/musicadoidas.json',
    baseUrl: 'https://paticotv01-code.github.io/Listavariada-/',
    jsonUrlFallback: 'https://raw.githubusercontent.com/paticotv01-code/Listavariada-/refs/heads/main/musicadoidas.json',
    baseUrlFallback: 'https://raw.githubusercontent.com/paticotv01-code/Listavariada-/refs/heads/main/',
    storageKeyFav: 'radio_favorites_rogervar',
    storageKeySrc: 'radio_src_cache_rogervar'
  }
};

const CONFIG = {
  timeoutTentativa: 12000,
  maxTentativasMostrar: 4
};

let currentGenre = 'variadas';
let musicas = [];
let currentPlaylist = [];
let currentIndex = 0;
let isPlaying = false;
let shuffleMode = true;
let isBackgroundActive = false;
let timerInterval = null;
let favorites = [];
let srcCache = {};
let fabOpen = false;
let hideControlsTimeout = null;
let carregandoMusica = false;
let buscaTimeout = null;
let tentativaAtual = null;
let usandoFallback = false;
let keepAliveInterval = null;
let _internalPause = false;
let _ultimoSrcBom = null;

const $ = id => document.getElementById(id);
const audio = $('musicPlayer');
const backgroundAudio = $('backgroundAudio');
const playBtn = $('playBtn');
const progressFill = $('progressFill');
const currentTimeEl = $('currentTime');
const totalTimeEl = $('totalTime');
const genreBadge = $('genreBadge');
const scrollText = $('scrollText');
const splash = $('splash');
const splashMsg = $('splashMsg');
const tapToStart = $('tap-to-start');
const appContainer = $('appContainer');
const notification = $('notification');
const audioStatus = $('audioStatus');
const bottomControls = $('bottomControls');
const shuffleBtn = $('shuffleBtn');
const heartBtn = $('heartBtn');
const nowTitle = $('nowTitle');
const nowArtist = $('nowArtist');
const favCount = $('favCount');
const searchInput = $('searchInput');
const clearSearchBtn = $('clearSearchBtn');
const equalizer = $('equalizer');
const loadingOverlay = $('loadingOverlay');

function getGenre() { return GENRES[currentGenre]; }

function showNotification(msg, d = 1500) {
  notification.textContent = msg;
  notification.classList.add('show');
  clearTimeout(showNotification._t);
  showNotification._t = setTimeout(() => notification.classList.remove('show'), d);
}
function showLoading(show) { loadingOverlay.classList.toggle('active', show); }
function formatTime(sec) {
  if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showControls() {
  bottomControls.classList.add('visible');
  clearTimeout(hideControlsTimeout);
  hideControlsTimeout = setTimeout(() => bottomControls.classList.remove('visible'), 5000);
}
function goFullscreen() {
  const d = document.documentElement;
  try {
    if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
    else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    else if (d.mozRequestFullScreen) d.mozRequestFullScreen();
    else if (d.msRequestFullscreen) d.msRequestFullscreen();
  } catch (e) {}
}

function urlCompleta(nome) {
  if (!nome || !nome.trim()) return '';
  if (/^https?:\/\//i.test(nome)) return nome;
  const g = getGenre();
  const base = usandoFallback ? g.baseUrlFallback : g.baseUrl;
  let n = nome.trim().replace(/^\.?\//, '').replace(/^\/+/, '');
  n = n.replace(/[^a-zA-Z0-9\-_.]/g, '');
  if (!n) return '';
  return base + n;
}
function gerarUrlsAlternativas(m) {
  const urls = new Set();
  const src = (m.src || '').trim();
  const cached = srcCache[m.id];
  if (cached) urls.add(cached);
  if (src) { const u = urlCompleta(src); if (u) urls.add(u); }
  if (src) {
    const base = src.replace(/\.[^.]+$/, '');
    const exts = ['mp3', 'm4a', 'ogg'];
    const variacoes = new Set();
    variacoes.add(base);
    variacoes.add(base.replace(/_/g, ' '));
    variacoes.add(base.replace(/_/g, '-'));
    variacoes.add(base.replace(/_/g, ''));
    variacoes.forEach(v => {
      exts.forEach(ext => {
        const u = urlCompleta(v + '.' + ext);
        if (u) urls.add(u);
      });
    });
  }
  return Array.from(urls);
}

function carregarDadosLocais() {
  const g = getGenre();
  try { favorites = JSON.parse(localStorage.getItem(g.storageKeyFav) || '[]'); } catch { favorites = []; }
  try { srcCache = JSON.parse(localStorage.getItem(g.storageKeySrc) || '{}'); } catch { srcCache = {}; }
  updateFavCount();
}
function salvarFavs() { try { localStorage.setItem(getGenre().storageKeyFav, JSON.stringify(favorites)); } catch {} }
function salvarSrcCache() { try { localStorage.setItem(getGenre().storageKeySrc, JSON.stringify(srcCache)); } catch {} }
function updateFavCount() { favCount.textContent = favorites.length; }

function toggleFavorito(id) {
  if (!id) return;
  const i = favorites.indexOf(id);
  if (i > -1) { favorites.splice(i, 1); showNotification('❤️ Removido', 1000); }
  else { favorites.push(id); showNotification('❤️ Adicionado!', 1000); }
  salvarFavs();
  updateHeartIcon(id);
  renderFavList();
}
function updateHeartIcon(id) {
  if (favorites.includes(id)) {
    heartBtn.className = 'fav-heart active';
    heartBtn.innerHTML = '<i class="fas fa-heart"></i>';
  } else {
    heartBtn.className = 'fav-heart';
    heartBtn.innerHTML = '<i class="far fa-heart"></i>';
  }
  updateFavCount();
}
function renderFavList() {
  const fl = $('favList');
  if (!fl) return;
  if (favorites.length === 0) {
    fl.innerHTML = '<div class="fav-empty">Nenhuma música favorita</div>';
    return;
  }
  const favs = favorites.map(id => musicas.find(m => m.id === id)).filter(Boolean);
  if (!favs.length) {
    fl.innerHTML = '<div class="fav-empty">Favoritas não encontradas</div>';
    return;
  }
  fl.innerHTML = '';
  favs.forEach(m => {
    const div = document.createElement('div');
    div.className = 'fav-item';
    div.innerHTML = `
      <div class="info" data-id="${m.id}">
        <div class="title">${m.title}</div>
        <div class="artist">${m.artist || ''}</div>
      </div>
      <button class="remove" data-id="${m.id}"><i class="fas fa-times-circle"></i></button>
    `;
    div.querySelector('.info').addEventListener('click', () => {
      playSongById(m.id);
      $('favModal').classList.remove('open');
    });
    div.querySelector('.remove').addEventListener('click', e => {
      e.stopPropagation();
      toggleFavorito(m.id);
      renderFavList();
    });
    fl.appendChild(div);
  });
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function carregarPlaylist() {
  try {
    showLoading(true);
    const g = getGenre();
    let data;
    try {
      data = await fetchJson(g.jsonUrl);
      usandoFallback = false;
    } catch (e1) {
      data = await fetchJson(g.jsonUrlFallback);
      usandoFallback = true;
      showNotification('⚠️ Usando Raw', 3000);
    }
    if (!Array.isArray(data)) {
      if (Array.isArray(data.musicas)) data = data.musicas;
      else if (Array.isArray(data.data)) data = data.data;
      else throw new Error('Formato JSON inválido');
    }
    musicas = data.filter(m => m && m.title && m.title.trim());
    musicas.forEach(m => {
      m.id = m.id || `mv_${Math.random().toString(36).slice(2, 8)}`;
      m.artist = m.artist || 'Artista desconhecido';
    });
    if (musicas.length === 0) throw new Error('Nenhuma música válida no JSON');
    return true;
  } catch (err) {
    splashMsg.innerHTML = `❌ ${err.message}`;
    return false;
  } finally {
    showLoading(false);
  }
}

function proximaDaPlaylist() {
  if (!currentPlaylist.length) {
    currentPlaylist = shuffleArray([...musicas]);
    currentIndex = 0;
  }
  if (currentIndex >= currentPlaylist.length) {
    const ultima = currentPlaylist[currentPlaylist.length - 1];
    const ultimoId = ultima ? ultima.id : null;
    currentPlaylist = shuffleArray([...musicas]);
    if (ultimoId && currentPlaylist.length > 1) {
      const i = currentPlaylist.findIndex(m => m.id === ultimoId);
      if (i > -1) currentPlaylist.splice(i, 1);
    }
    currentIndex = 0;
  }
  const m = currentPlaylist[currentIndex];
  if (m) currentIndex++;
  return m;
}

function updateNowPlaying(m) {
  if (!m) return;
  nowTitle.textContent = m.title;
  nowArtist.textContent = m.artist;
  scrollText.innerHTML = `🎵 ${m.title} — ${m.artist} [${getGenre().nome}] 🎵`;
  updateHeartIcon(m.id);
}

function tentarSrc(src, timeoutMs) {
  return new Promise(resolve => {
    let resolvido = false;
    const finalize = ok => {
      if (resolvido) return;
      resolvido = true;
      clearTimeout(timeoutId);
      audio.oncanplay = null;
      audio.onerror = null;
      audio.onplaying = null;
      resolve(ok);
    };
    const timeoutId = setTimeout(() => {
      if (!audio.paused && audio.currentTime > 0) finalize(true);
      else finalize(false);
    }, timeoutMs);
    audio.oncanplay = () => { audio.play().catch(() => {}); };
    audio.onplaying = () => finalize(true);
    audio.onerror = () => finalize(false);
    _internalPause = true;
    try { audio.pause(); } catch(e) {}
    _internalPause = false;
    audio.src = src;
    audio.load();
    audio.play().catch(() => {});
  });
}

async function playMusic() {
  if (carregandoMusica) return;
  if (!isBackgroundActive) { showNotification('⚠️ Ative o áudio primeiro!', 1000); return; }
  if (!musicas.length) { showNotification('Playlist vazia', 1500); return; }
  const track = proximaDaPlaylist();
  if (!track) { showNotification('Nenhuma música disponível', 1000); return; }
  carregandoMusica = true;
  updateNowPlaying(track);
  const urls = gerarUrlsAlternativas(track);
  if (!urls.length) {
    carregandoMusica = false;
    setTimeout(nextTrack, 500);
    return;
  }
  if (tentativaAtual && tentativaAtual.cancel) tentativaAtual.cancel();
  let cancelado = false;
  tentativaAtual = { cancel: () => { cancelado = true; } };
  for (let i = 0; i < urls.length; i++) {
    if (cancelado) return;
    const url = urls[i];
    const ok = await tentarSrc(url, CONFIG.timeoutTentativa);
    if (cancelado) return;
    if (ok) {
      isPlaying = true;
      _ultimoSrcBom = audio.src;
      audio.loop = false;
      playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      equalizer.classList.remove('paused');
      startTimer();
      carregandoMusica = false;
      showNotification(`✅ ${track.title}`, 1200);
      if (url !== track.src) {
        track.src = url;
        srcCache[track.id] = url;
        salvarSrcCache();
      }
      return;
    }
  }
  carregandoMusica = false;
  /* fallback: loop da última boa pra não parar nunca */
  if (_ultimoSrcBom) {
    try {
      audio.loop = true;
      audio.src = _ultimoSrcBom;
      audio.load();
      audio.play().catch(() => {});
      isPlaying = true;
      playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      equalizer.classList.remove('paused');
      startTimer();
      showNotification('🔁 Modo loop', 1500);
      return;
    } catch(e) {}
  }
  setTimeout(nextTrack, 500);
}

function nextTrack() {
  if (carregandoMusica && tentativaAtual) tentativaAtual.cancel();
  carregandoMusica = false;
  if (isBackgroundActive && musicas.length) {
    playMusic();
  } else {
    const t = proximaDaPlaylist();
    if (t) updateNowPlaying(t);
  }
  showControls();
}

function prevTrack() {
  if (carregandoMusica && tentativaAtual) tentativaAtual.cancel();
  carregandoMusica = false;
  if (!currentPlaylist.length) return nextTrack();
  currentIndex = Math.max(0, currentIndex - 2);
  const t = currentPlaylist[currentIndex];
  if (!t) return nextTrack();
  updateNowPlaying(t);
  if (isBackgroundActive) {
    carregandoMusica = true;
    playMusic();
  } else {
    currentIndex++;
  }
  showControls();
}

function togglePlay() {
  if (!isBackgroundActive) { showNotification('Clique em ATIVAR RÁDIO!', 1200); return; }
  if (audio.paused) {
    if (audio.src) {
      audio.play().then(() => {
        isPlaying = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        equalizer.classList.remove('paused');
        startTimer();
      }).catch(() => playMusic());
    } else playMusic();
  } else {
    try { audio.pause(); } catch(e) {}
  }
  showControls();
}

function toggleShuffle() {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  showNotification(shuffleMode ? '🔀 Aleatório ON' : '➡️ Sequencial', 800);
  showControls();
}

function playSongById(id) {
  const m = musicas.find(x => x.id === id);
  if (!m) { showNotification('Música não encontrada', 1000); return; }
  if (carregandoMusica && tentativaAtual) tentativaAtual.cancel();
  carregandoMusica = false;
  _internalPause = true;
  try { audio.pause(); } catch(e) {}
  _internalPause = false;
  try { audio.removeAttribute('src'); audio.load(); } catch(e) {}
  const outras = musicas.filter(x => x.id !== id);
  currentPlaylist = shuffleArray([m, ...outras]);
  currentIndex = 1;
  updateNowPlaying(m);
  if (isBackgroundActive) {
    carregandoMusica = true;
    playMusic();
  }
  showNotification(`🎵 ${m.title}`, 1200);
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    if (!audio.paused && audio.duration && isFinite(audio.duration)) {
      progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
      totalTimeEl.textContent = formatTime(audio.duration);
    }
  }, 250);
}
function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function silentWavUrl() {
  try {
    const sr = 44100, ns = sr * 2;
    const buf = new ArrayBuffer(44 + ns * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + ns * 2, true);
    w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, ns * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  } catch { return ''; }
}

function manterAtivo() {
  if (keepAliveInterval) clearInterval(keepAliveInterval);
  keepAliveInterval = setInterval(async () => {
    if (!isBackgroundActive) return;
    try {
      if (backgroundAudio.paused && backgroundAudio.src) {
        try { await backgroundAudio.play(); } catch(e) {}
      }
      if (isPlaying && audio.paused && !carregandoMusica && audio.currentSrc && audio.currentSrc !== location.href && !audio.loop) {
        try { await audio.play(); } catch(e) {}
      }
    } catch(e) {}
  }, 1000);
}

async function ativarAudio() {
  try {
    showLoading(true);
    const silent = silentWavUrl();
    if (silent) {
      backgroundAudio.src = silent;
      backgroundAudio.loop = true;
      backgroundAudio.volume = 0.01;
      await backgroundAudio.play();
    }
    isBackgroundActive = true;
    audioStatus.classList.add('active');
    audioStatus.innerHTML = '<span class="dot"></span> Ativado';
    if ('wakeLock' in navigator) { try { await navigator.wakeLock.request('screen'); } catch {} }
    showLoading(false);
    manterAtivo();
    await playMusic();
    return true;
  } catch (err) {
    showLoading(false);
    showNotification('❌ Toque novamente', 2500);
    return false;
  }
}

function buscarMusica(termo) {
  const tl = termo.toLowerCase().trim();
  if (tl.length < 2) { showNotification('📋 Mínimo 2 caracteres', 1000); return; }
  const res = musicas.filter(m =>
    m.title.toLowerCase().includes(tl) || m.artist.toLowerCase().includes(tl)
  );
  if (!res.length) { showNotification('🔍 Nada encontrado', 1500); return; }
  const primeira = res[0];
  currentPlaylist = shuffleArray([primeira, ...res.filter(m => m.id !== primeira.id)]);
  currentIndex = 0;
  updateNowPlaying(primeira);
  genreBadge.innerHTML = `🔍 ${res.length} resultados`;
  if (isBackgroundActive) playMusic();
  showNotification(`🔍 ${res.length} resultado(s)`, 1500);
}

function limparBusca() {
  searchInput.value = '';
  clearSearchBtn.style.display = 'none';
  genreBadge.innerHTML = `🎧 ${getGenre().nome}`;
  if (musicas.length) {
    currentPlaylist = shuffleArray([...musicas]);
    currentIndex = 0;
    const p = currentPlaylist[0];
    if (p) updateNowPlaying(p);
  }
  showNotification('📋 Playlist restaurada', 800);
}

async function recarregarPlaylist() {
  showNotification('🔄 Recarregando...', 1200);
  if (carregandoMusica && tentativaAtual) tentativaAtual.cancel();
  carregandoMusica = false;
  const ok = await carregarPlaylist();
  if (ok) {
    currentPlaylist = shuffleArray([...musicas]);
    currentIndex = 0;
    const p = currentPlaylist[0];
    if (p) updateNowPlaying(p);
    showNotification(`✅ ${musicas.length} músicas`, 1500);
  }
}

async function trocarGenero(genreKey) {
  if (!GENRES[genreKey] || genreKey === currentGenre) { fecharFab(); return; }
  showNotification(`🔄 Carregando ${GENRES[genreKey].nome}...`, 1500);
  if (carregandoMusica && tentativaAtual) tentativaAtual.cancel();
  carregandoMusica = false;
  _internalPause = true;
  try { audio.pause(); } catch(e) {}
  _internalPause = false;
  try { audio.removeAttribute('src'); audio.load(); } catch(e) {}
  stopTimer();
  currentGenre = genreKey;
  document.documentElement.style.setProperty('--cor', GENRES[genreKey].cor);
  genreBadge.innerHTML = `🎧 ${GENRES[genreKey].nome}`;
  scrollText.innerHTML = `🎵 RÁDIO PLAY 12 — ${GENRES[genreKey].nome} 🎵`;
  document.title = `PLAY 12 — ${GENRES[genreKey].nome}`;
  document.querySelectorAll('.genre-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.genre === genreKey);
  });
  carregarDadosLocais();
  const ok = await carregarPlaylist();
  if (ok) {
    currentPlaylist = shuffleArray([...musicas]);
    currentIndex = 0;
    const p = currentPlaylist[0];
    if (p) updateNowPlaying(p);
    if (isBackgroundActive) playMusic();
    showNotification(`✅ ${GENRES[genreKey].nome}: ${musicas.length} músicas`, 1800);
  }
  fecharFab();
}

async function iniciar() {
  try {
    carregarDadosLocais();
    renderFavList();
    splashMsg.textContent = `Carregando ${getGenre().nome}...`;
    const ok = await carregarPlaylist();
    if (!ok) return;
    currentPlaylist = shuffleArray([...musicas]);
    currentIndex = 0;
    const p = currentPlaylist[0];
    if (p) updateNowPlaying(p);
    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => {
        splash.style.display = 'none';
        appContainer.style.display = 'block';
        tapToStart.style.display = 'block';
        goFullscreen();
      }, 400);
    }, 400);
  } catch (err) {
    splashMsg.innerHTML = `❌ ${err.message}`;
  }
}

audio.addEventListener('play', () => {
  isPlaying = true;
  playBtn.innerHTML = '<i class="fas fa-pause"></i>';
  equalizer.classList.remove('paused');
  startTimer();
});
audio.addEventListener('pause', () => {
  if (_internalPause) return;
  if (carregandoMusica) return;
  isPlaying = false;
  playBtn.innerHTML = '<i class="fas fa-play"></i>';
  equalizer.classList.add('paused');
  stopTimer();
});

/* ESSENCIAL: onended chama nextTrack SEM setTimeout (tela bloqueada não throttla evento) */
audio.addEventListener('ended', () => {
  if (carregandoMusica) return;
  isPlaying = false;
  /* Se estava em loop de fallback, próxima real agora */
  if (audio.loop) audio.loop = false;
  nextTrack();
});

heartBtn.addEventListener('click', () => {
  const m = currentPlaylist[currentIndex - 1] || currentPlaylist[0];
  if (m) toggleFavorito(m.id);
});
$('favTopBtn').addEventListener('click', () => { renderFavList(); $('favModal').classList.add('open'); });
$('closeFavModal').addEventListener('click', () => $('favModal').classList.remove('open'));
$('closeFavBtn').addEventListener('click', () => $('favModal').classList.remove('open'));

const fabMain = $('fabMain'), fabSub = $('fabSub');
function fecharFab() {
  fabOpen = false;
  fabSub.classList.remove('open');
  fabMain.innerHTML = '<i class="fas fa-plus"></i>';
}
fabMain.addEventListener('click', () => {
  fabOpen = !fabOpen;
  fabSub.classList.toggle('open', fabOpen);
  fabMain.innerHTML = fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
});
$('fabFullscreen').addEventListener('click', () => { fecharFab(); goFullscreen(); showNotification('⛶ Tela cheia', 1000); });
$('fabReload').addEventListener('click', () => { fecharFab(); recarregarPlaylist(); });
$('fabShare').addEventListener('click', () => {
  const t = currentPlaylist[currentIndex - 1] || currentPlaylist[0];
  if (!t) { fecharFab(); return showNotification('Nada tocando', 1000); }
  const msg = `🎵 Ouvindo "${t.title}" - ${t.artist} no PLAY 12 ${getGenre().nome} 🎧`;
  if (navigator.share) navigator.share({ title: `PLAY 12 — ${getGenre().nome}`, text: msg, url: location.href }).catch(() => {});
  else navigator.clipboard.writeText(msg + ' ' + location.href).then(() => showNotification('📋 Copiado!', 2000)).catch(() => showNotification('Indisponível', 1200));
  fecharFab();
});
document.querySelectorAll('.genre-option').forEach(btn => {
  btn.addEventListener('click', () => trocarGenero(btn.dataset.genre));
});

playBtn.addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', nextTrack);
$('prevBtn').addEventListener('click', prevTrack);
shuffleBtn.addEventListener('click', toggleShuffle);

$('progressBar').addEventListener('click', e => {
  if (audio.duration && isFinite(audio.duration)) {
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    showControls();
  }
});

searchInput.addEventListener('input', e => {
  const termo = e.target.value.trim();
  clearSearchBtn.style.display = termo ? 'block' : 'none';
  clearTimeout(buscaTimeout);
  buscaTimeout = setTimeout(() => {
    if (!termo) { limparBusca(); return; }
    buscarMusica(termo);
  }, 500);
});
clearSearchBtn.addEventListener('click', () => { limparBusca(); searchInput.focus(); });

document.addEventListener('click', e => {
  if (fabSub.classList.contains('open') && !fabSub.contains(e.target) && e.target !== fabMain && !fabMain.contains(e.target)) {
    fecharFab();
  }
  showControls();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': nextTrack(); break;
    case 'ArrowLeft': prevTrack(); break;
    case 's': case 'S': toggleShuffle(); break;
    case 'f': case 'F': {
      const m = currentPlaylist[currentIndex - 1] || currentPlaylist[0];
      if (m) toggleFavorito(m.id);
      break;
    }
  }
});

tapToStart.addEventListener('click', async () => {
  showNotification('🔊 Ativando...', 1000);
  const ok = await ativarAudio();
  if (ok) { tapToStart.style.display = 'none'; goFullscreen(); }
});

let lastTap = 0;
$('nowPlaying').addEventListener('click', () => {
  const now = Date.now();
  if (now - lastTap < 300 && now - lastTap > 50) {
    const m = currentPlaylist[currentIndex - 1] || currentPlaylist[0];
    if (m) toggleFavorito(m.id);
  }
  lastTap = now;
  showControls();
});

$('favModal').addEventListener('click', e => {
  if (e.target === $('favModal')) $('favModal').classList.remove('open');
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    try {
      if (backgroundAudio.paused && backgroundAudio.src && isBackgroundActive) backgroundAudio.play().catch(() => {});
    } catch(e) {}
    if (isBackgroundActive && isPlaying && audio.paused && !carregandoMusica && audio.currentSrc && !audio.loop) {
      audio.play().catch(() => {});
    }
  } else {
    try {
      if (backgroundAudio.paused && backgroundAudio.src && isBackgroundActive) backgroundAudio.play().catch(() => {});
    } catch(e) {}
  }
});

window.addEventListener('pageshow', () => {
  if (isBackgroundActive && isPlaying && audio.paused && !carregandoMusica && audio.currentSrc && !audio.loop) {
    audio.play().catch(() => {});
  }
  try {
    if (backgroundAudio.paused && backgroundAudio.src) backgroundAudio.play().catch(() => {});
  } catch(e) {}
});

window.addEventListener('beforeunload', () => {
  if (keepAliveInterval) clearInterval(keepAliveInterval);
});

window.addEventListener('load', iniciar);
</script>
